name: Release

# Every merge to main is a release: v<major>.<minor>.<n>, the next patch for
# the major.minor in package.json (edit that to start a new minor). Tags it,
# writes a GitHub Release from the merged PRs, and publishes the npm package
# the agent-os launcher installs from.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Not in a build-only copy of the repo (elabx-org/agent-os-build)
    if: github.repository == 'elabx-org/agent-os'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "HEAD is already released"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE=$(node -p 'require("./package.json").version.split(".").slice(0,2).join(".")')
          LAST=$(git tag -l "v$BASE.*" | sed "s/^v$BASE\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          VERSION="$BASE.$(( ${LAST:--1} + 1 ))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Tag and release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "Agent-OS v$VERSION" --generate-notes --latest

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@elabx-org"

      - name: Publish npm package
        if: steps.version.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --ignore-scripts
